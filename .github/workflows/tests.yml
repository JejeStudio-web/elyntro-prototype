name: Tests

on:
  push:
    branches: [main, "feature/**", "feat/**", "phase-1/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Validate inline frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline script, found {len(scripts)}")
          Path("/tmp/elyntro-frontend.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/elyntro-frontend.js
      - name: Validate Creative Studio module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("static/creative-studio.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, flags=re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one Studio module script, found {len(scripts)}")
          Path("/tmp/elyntro-studio.mjs").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/elyntro-studio.mjs
      - name: Run tests
        run: python -m pytest -q

  build-browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build isolated Playwright worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.browser-worker
          push: false
          tags: elyntro-browser-worker:ci
