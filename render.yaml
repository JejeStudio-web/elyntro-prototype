services:
  - type: web
    name: elyntro-prototype
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: ELYNTRO_BROWSER_WORKER_URL
        fromService:
          type: pserv
          name: elyntro-browser-worker
          property: hostport
      - key: ELYNTRO_BROWSER_WORKER_TOKEN
        sync: false
      - key: ELYNTRO_BROWSER_ALLOWLIST
        sync: false
      - key: ELYNTRO_PLAYWRIGHT_ENABLED
        value: "false"
      - key: ELYNTRO_DATABASE_URL
        sync: false
      - key: ELYNTRO_REGISTRATION_ENABLED
        value: "false"
      - key: ELYNTRO_COOKIE_SECURE
        value: "true"

  - type: pserv
    name: elyntro-browser-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.browser-worker
    dockerContext: .
    envVars:
      - key: ELYNTRO_BROWSER_WORKER_TOKEN
        sync: false
      - key: ELYNTRO_BROWSER_ALLOWLIST
        sync: false
